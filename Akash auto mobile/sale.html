<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Vehicle Sales</title>
   <link rel="icon" href="./favicon.png">
  <style>
    body { font-family: sans-serif; background: #fffefb; padding: 20px; }
    .sales-container { max-width: 1000px; margin: auto; }
    .vehicle-section { background: #e6f2ff; border: 2px solid #003366; padding: 16px; margin: 20px 0; border-radius: 10px; }
    .vehicle-card { background: white; border: 1px solid #ccc; padding: 16px; margin-top: 10px; border-radius: 8px; }
    .vehicle-card img { max-width: 100%; max-height: 150px; margin-top: 10px; border-radius: 4px; object-fit: contain; border: 1px solid #003366; }
    h2, h3 { color: #003366; }
    .no-data { color: red; text-align: center; font-weight: bold; margin-top: 20px; }
  </style>
</head>
<body>
  <main class="sales-container">
    <h2>Available Vehicles for Sale</h2>
    <div id="sales-list"></div>
  </main>

  <script>
    const salesList = document.getElementById('sales-list');
    const allVehicles = JSON.parse(localStorage.getItem('vehiclesData') || '{}');

    // Get query param for filtering (e.g. ?service=KTM)
    const urlParams = new URLSearchParams(window.location.search);
    const filterService = urlParams.get('service');

    function renderVehicles(service, vehicles) {
      const section = document.createElement('div');
      section.className = 'vehicle-section';
      section.innerHTML = `<h3>${service}</h3>`;

      vehicles.forEach(vehicle => {
        const card = document.createElement('div');
        card.className = 'vehicle-card';
        card.innerHTML = `
          <strong>Model:</strong> ${vehicle.model}<br>
          <strong>Year:</strong> ${vehicle.year}<br>
          <strong>Price:</strong> ₹${vehicle.price || 'N/A'}<br>
          <strong>Description:</strong> ${vehicle.description || 'No description'}
        `;

        if (vehicle.photo) {
          const img = document.createElement('img');
          img.src = vehicle.photo;
          img.alt = vehicle.model;
          card.appendChild(img);
        }

        section.appendChild(card);
      });

      salesList.appendChild(section);
    }

    if (Object.keys(allVehicles).length === 0) {
      salesList.innerHTML = `<p class="no-data">No vehicles available yet.</p>`;
    } else {
      if (filterService) {
        if (allVehicles[filterService]) {
          renderVehicles(filterService, allVehicles[filterService]);
        } else {
          salesList.innerHTML = `<p class="no-data">No vehicles available for "${filterService}".</p>`;
        }
      } else {
        Object.entries(allVehicles).forEach(([service, vehicles]) => {
          renderVehicles(service, vehicles);
        });
      }
    }
  </script>
</body>
</html>
