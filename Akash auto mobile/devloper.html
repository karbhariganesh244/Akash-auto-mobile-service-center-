<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Team Cards</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #f4f7fa, #e0eafc);
      margin: 0;
      padding: 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    h1 {
      text-align: center;
      color: #222;
      margin-bottom: 10px;
    }

    h2 {
      margin-top: 40px;
      color: #444;
      font-size: 22px;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    hr {
      width: 80%;
      border: 0;
      height: 2px;
      margin: 20px 0;
      background: linear-gradient(to right, #ff6a00, #ee0979);
      border-radius: 5px;
      animation: fadeIn 1s ease-in-out;
    }

    .card-container {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 20px;
      margin-top: 20px;
    }

    .card {
      width: 260px;
      padding: 20px;
      text-align: center;
      border-radius: 16px;
      background: #fff;
      transition: transform 0.4s ease, box-shadow 0.4s ease;
      box-shadow: 0 6px 15px rgba(0,0,0,0.1);
      animation: fadeUp 1s ease;
    }

    .card:hover {
      transform: translateY(-12px) scale(1.05);
      box-shadow: 0 12px 25px rgba(0,0,0,0.25);
    }

    .card img {
      width: 150px;
      height: 150px;
      border-radius: 50%;
      object-fit: cover;
      margin-bottom: 15px;
      border: 3px solid #ccc;
      transition: border-color 0.3s ease;
    }

    .card h3 {
      margin: 10px 0 5px;
      color: #111;
      font-size: 18px;
    }

    .card p {
      margin: 0;
      font-size: 14px;
      color: #444;
      margin-bottom: 5px;
    }

    .role {
      font-weight: bold;
      margin: 8px 0;
      font-size: 15px;
    }

    /* Different styles for each role */
    .owner {
      background: linear-gradient(135deg, #ffe0b2, #ffcc80);
      border: 2px solid #FF5733;
    }
    .owner img { border-color: #FF5733; }
    .owner .role { color: #FF5733; }

    .developer {
      background: linear-gradient(135deg, #bbdefb, #90caf9);
      border: 2px solid #007BFF;
    }
    .developer img { border-color: #007BFF; }
    .developer .role { color: #007BFF; }

    .employee {
      background: linear-gradient(135deg, #c8e6c9, #a5d6a7);
      border: 2px solid #28A745;
    }
    .employee img { border-color: #28A745; }
    .employee .role { color: #28A745; }

    /* Animations */
    @keyframes fadeUp {
      from {
        opacity: 0;
        transform: translateY(40px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @keyframes fadeIn {
      from { opacity: 0; width: 0; }
      to { opacity: 1; width: 80%; }
    }
  </style>
</head>
<body>
  <h1>Our Team</h1>

  <h2>Developer</h2>
  <hr>
  <div class="card-container" id="developer"></div>

  <h2>Owner</h2>
  <hr>
  <div class="card-container" id="owner"></div>

  <h2>Employees</h2>
  <hr>
  <div class="card-container" id="employees"></div>

  <script>
    const team = [
      { name: "Ganesh karbhari", role: "Developer", email: "karbhariganesh244@gmail.com", phone: "+91 7795324416", image: "C:\Users\karbh\OneDrive\Desktop\Akash auto mobile\img\dev\ganesh.jpg", class: "developer", section: "developer" },
      { name: "Ramchandera", role: "Owner", email: "owner@example.com", phone: "+91 9123456780", image: "https://via.placeholder.com/150?text=Owner", class: "owner", section: "owner" },
      { name: "Rina Patel", role: "Employee", email: "employee1@example.com", phone: "+91 9000000001", image: "https://via.placeholder.com/150?text=Emp1", class: "employee", section: "employees" },
      { name: "Amit Sharma", role: "Employee", email: "employee2@example.com", phone: "+91 9000000002", image: "https://via.placeholder.com/150?text=Emp2", class: "employee", section: "employees" },
      { name: "Sunita Mehra", role: "Employee", email: "employee3@example.com", phone: "+91 9000000003", image: "https://via.placeholder.com/150?text=Emp3", class: "employee", section: "employees" },
      { name: "Raj Kumar", role: "Employee", email: "employee4@example.com", phone: "+91 9000000004", image: "https://via.placeholder.com/150?text=Emp4", class: "employee", section: "employees" }
    ];

    team.forEach(member => {
      const card = document.createElement('div');
      card.classList.add('card', member.class);
      card.innerHTML = `
        <img src="${member.image}" alt="${member.name}">
        <h3>${member.name}</h3>
        <p class="role">${member.role}</p>
        <p>Email: ${member.email}</p>
        <p>Phone: ${member.phone}</p>
      `;
      document.getElementById(member.section).appendChild(card);
    });
  </script>
</body>
</html>
