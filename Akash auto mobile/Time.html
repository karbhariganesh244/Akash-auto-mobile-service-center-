<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Live Service Time</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #fdf6e4;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
    }
    .time-box {
      background: #fff;
      border: 2px solid #e51e49;
      border-radius: 12px;
      padding: 30px 40px;
      box-shadow: 0px 6px 15px rgba(0,0,0,0.1);
      text-align: center;
    }
    .time-box h2 {
      color: #e51e49;
      margin-bottom: 15px;
    }
    .datetime {
      font-size: 22px;
      font-weight: bold;
      color: #333;
    }
  </style>
</head>
<body>
  <div class="time-box">
    <h2>📅 Current Service Time</h2>
    <div id="datetime" class="datetime"></div>
  </div>

  <script>
    function updateTime() {
      const now = new Date();
      const options = {
        weekday: "long",
        year: "numeric",
        month: "long",
        day: "numeric",
        hour: "2-digit",
        minute: "2-digit",
        second: "2-digit"
      };
      document.getElementById("datetime").textContent =
        now.toLocaleDateString("en-IN", options);
    }

    // Update every second
    setInterval(updateTime, 1000);
    updateTime(); // initial call
  </script>
</body>
</html>
